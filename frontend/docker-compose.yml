networks:
  proxy-network:
    external: true
services:
  Portfolio:
    container_name: portfolio
    image: dagmarl/portfolio:main
    expose:
      - "3000:3000"
    restart: unless-stopped

    networks:
      - proxy-network


  caddy:
    container_name: caddy
    image: caddy:latest
    ports:
      - "80:80"
    volumes:
      - ./data:/data
      - ./config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    restart: unless-stopped

    networks:
      - proxy-network